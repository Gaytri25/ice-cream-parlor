<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

	<style>
	/* Import Google Fonts */
@import url('https://fonts.googleapis.com/css?family=Montserrat:400,700|Open+Sans');

/* Reset Default Styles */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

/* Background Styling */
.bgimage {
    width: 100%;
    height: 100vh;
    background: url('img/img7.jpg') no-repeat center center/cover;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
}

/* Overlay */
.bgimage::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
}

/* Navigation Menu */
.menu {
    position: absolute;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 50px;
    background: rgba(0, 0, 0, 0.8);
    z-index: 2;
}

.rightmenu {
    display: flex;
    align-items: center;
    justify-content: flex-end; /* Ensures items stay on the right */
}

.rightmenu ul {
    list-style: none;
    display: flex;
    padding: 0;
    margin: 0;
}

.rightmenu ul li {
    margin: 0 15px;
}

.rightmenu ul li a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    transition: 0.3s;
}

.rightmenu ul li a:hover,
.rightmenu ul li a.active {
    color: #ffcc00;
    text-decoration: underline;
}

/* Mobile Responsive Navigation */
@media screen and (max-width: 768px) {
    .menu {
        flex-direction: column;
        align-items: center;
        padding: 10px;
    }

    .rightmenu {
        width: 100%;
        justify-content: center;
        margin-top: 10px;
    }

    .rightmenu ul {
        flex-direction: column;
        text-align: center;
    }

    .rightmenu ul li {
        margin: 10px 0;
    }
}


/* Login Box */
.loginbox {
    width: 350px;
    background: rgba(255, 255, 255, 0.9);
    color: black;
    padding: 20px;
    text-align: center;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
    position: relative;
    z-index: 2;
}

.loginbox .avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 10px;
}

.loginbox h1 {
    margin-bottom: 20px;
    font-size: 24px;
}

.loginbox p {
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: bold;
}

.loginbox input {
    width: 100%;
    padding: 10px;
    margin-bottom: 15px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    outline: none;
}

.loginbox input[type="text"],
.loginbox input[type="password"] {
    background: #f5f5f5;
}

.loginbox input[type="submit"] {
    background: #ffcc00;
    color: black;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s;
}

.loginbox input[type="submit"]:hover {
    background: #ff9900;
}

.loginbox a {
    display: block;
    margin-top: 10px;
    color: #ff6600;
    text-decoration: none;
    font-size: 14px;
}

.loginbox a:hover {
    color: #ff3300;
}

/* Avatar Animation */
.avatar {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 10px;
    border: 3px solid #ffcc00;
    animation: bounce 2s infinite ease-in-out;
}

/* Bounce Animation */
@keyframes bounce {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-10px);
    }
}

/* Hover Glow Effect */
.avatar:hover {
    box-shadow: 0 0 15px #ffcc00;
    transition: 0.3s ease-in-out;
}


	
	
	
	
	</style>
	
	
	
</head>
<body>

            </div>
            
                <div class="rightmenu">
                <ul>
                    <li><a href="#" class="active">Home</a></li>
                    <li><a href="#team">Our Team</a></li>
                    <li><a href="register.html">Sign Up</a></li>
                    <li><a href="login.html">Login</a></li>
					<li><a href="order1.html">Service</a></li>
                </ul>
            </div>
           
        </div>




        <div class="loginbox">
            <img src="img/img1.png" class="avatar">
            <h1>Login Here</h1>
            <form action="logincon.php" method="POST">
                <p>Username</p>
                <input type="text" name="username" placeholder="Enter Username" required>
                <p>Password</p>
                <input type="password" name="password" placeholder="Enter Password" required>
                <input type="submit" name="login" value="Login">
                <a href="register.html">Don't have an account?</a>
            </form>
        </div>

    </div>

</body>
</html>
