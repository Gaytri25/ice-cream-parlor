<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You - Ice Cream Parlor</title>
    <link rel="stylesheet" href="css/style.css"> <!-- External CSS -->
    <style>
        /* General Styling */
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to right, #ffcc00, #ff6600);
            text-align: center;
            color: #fff;
        }

        /* Navigation Bar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #222;
            padding: 10px 20px;
            position: fixed;
            width: 100%;
            top: 0;
            left: 0;
            z-index: 1000;
        }

        .navbar h2 {
            color: #ffcc00;
            margin: 0;
            font-size: 24px;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            margin: 0;
            padding: 0;
        }

        .navbar ul li {
            margin: 0 15px;
        }

        .navbar ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .navbar ul li a:hover {
            color: #ffcc00;
        }

        /* Thank You Section */
        .thankyou-container {
            margin-top: 100px;
            padding: 50px;
            background: white;
            color: black;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            display: inline-block;
            animation: fadeIn 1.5s ease-in-out;
        }

        h1 {
            font-size: 36px;
            color: #ff6600;
        }

        p {
            font-size: 20px;
            margin: 15px 0;
        }

        .thankyou-img {
            width: 150px;
            animation: bounce 2s infinite;
        }

        /* Animated Ice Cream Images */
        .icecream-images {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .icecream-images img {
            width: 100px;
            height: auto;
            animation: float 3s infinite ease-in-out;
        }

        /* Keyframe Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Back to Home Button */
        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #ff6600;
            color: white;
            text-decoration: none;
            font-size: 18px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .home-btn:hover {
            background: #ff3300;
        }
    </style>
</head>

        <div class="icecream-images">
           
        </div>

    </div>

</body>
